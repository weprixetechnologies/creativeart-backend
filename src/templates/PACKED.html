<p class="greeting">Your order is packed! 📦</p>
<p class="intro">Hi {{customerName}}, great news! Your order <strong>{{orderNumber}}</strong> has been carefully packed and is ready for dispatch. We'll send you the tracking details as soon as it ships.</p>
<div class="infobox">
  <p><span class="label">Order Number</span><br/><span class="value">{{orderNumber}}</span></p>

<div class="cta-wrap">
  <a href="{{frontendUrl}}/orders/{{orderNumber}}" class="cta">View Order Details</a>
</div>
